<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Gallery mẫu móng</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body { margin: 0; font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: #F5F6F8; color: #14161A; -webkit-font-smoothing: antialiased; }
a { color: #5A43E0; text-decoration: none; }
a:hover { color: #4836C4; }
</style>
</helmet>
<div style="width: 1440px; height: 1040px; box-sizing: border-box; display: flex; overflow: hidden; background: #F5F6F8;">

  <aside style="width: 248px; flex-shrink: 0; height: 100%; background: #191B21; box-sizing: border-box; padding: 22px 14px; display: flex; flex-direction: column; gap: 26px;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px;">
      <div style="width: 34px; height: 34px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 15px;">N</div>
      <div>
        <div style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 15px; color: #FFFFFF; letter-spacing: -0.015em;">NailSpace</div>
        <div style="font-size: 11px; color: #8B92A0; margin-top: 1px;">Nail Studio Hạ Vy</div>
      </div>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 2px;">
      <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
        <a href="{{item.href}}" style="display: flex; align-items: center; gap: 11px; height: 42px; padding: 0 12px; border-radius: 10px; font-size: 13.5px; font-weight: {{item.weight}}; color: {{item.color}}; background: {{item.bg}};">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="{{item.d}}"></path></svg>
          <span style="flex-grow: 1;">{{item.label}}</span>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; background: #22242B;">
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #34373F; color: #C9CEDA; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600;">HV</div>
      <div style="flex-grow: 1;">
        <div style="font-size: 13px; font-weight: 600; color: #FFFFFF;">Trần Hạ Vy</div>
        <div style="font-size: 11px; color: #8B92A0;">Chủ tiệm</div>
      </div>
    </div>
  </aside>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">

    <header style="height: 68px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #E4E7EC; display: flex; align-items: center; gap: 14px; padding: 0 26px; box-sizing: border-box;">
      <div>
        <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.02em;">Gallery mẫu móng</h1>
        <div style="font-size: 12px; color: #737A88; margin-top: 2px;">240 mẫu · 186 mẫu đang hiện trên landing page</div>
      </div>
      <div style="flex-grow: 1;"></div>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #14161A; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer;">Sắp xếp thứ tự hiển thị</button>
      <button type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: none; background: {{accent}}; color: #FFFFFF; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M8 8l4-4 4 4M4 18v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"></path></svg>
        Tải ảnh mẫu lên
      </button>
    </header>

    <div style="flex-grow: 1; padding: 20px 26px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">

      <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
        <div style="display: flex; gap: 7px;">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
            <span style="display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.color}}; font-size: 13px; font-weight: 600;">
              {{f.label}}
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: {{f.countColor}};">{{f.count}}</span>
            </span>
          </sc-for>
        </div>
        <div style="flex-grow: 1;"></div>
        <div style="display: flex; align-items: center; gap: 9px; width: 240px; height: 36px; border-radius: 10px; border: 1px solid #E4E7EC; background: #FFFFFF; padding: 0 12px; box-sizing: border-box;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B92A0" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input type="search" aria-label="Tìm mẫu theo mã" placeholder="Tìm theo mã mẫu, ví dụ HV-231" style="flex-grow: 1; border: none; outline: none; background: transparent; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 12.5px; color: #14161A;">
        </div>
      </div>

      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; align-content: start; overflow: hidden;">

        <button type="button" style="height: 246px; border-radius: 14px; border: 1px dashed #C3C9D4; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-family: 'Be Vietnam Pro', system-ui, sans-serif;">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #EEEBFD; color: {{accent}}; display: flex; align-items: center; justify-content: center;">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </span>
          <span style="font-size: 13px; font-weight: 600; color: #14161A;">Thêm mẫu mới</span>
          <span style="font-size: 11.5px; color: #8B92A0; padding: 0 14px; text-align: center;">Kéo ảnh vào đây hoặc bấm để chọn</span>
        </button>

        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="17">
          <figure style="margin: 0; display: flex; flex-direction: column; gap: 9px;">
            <div style="position: relative; height: 186px; border-radius: 14px; background: {{t.tint}}; border: 1px solid #E4E7EC; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 10px;">
              <div style="display: flex; align-items: flex-start; gap: 6px;">
                <span style="padding: 3px 8px; border-radius: 999px; background: #FFFFFF; color: #454B57; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 600;">{{t.code}}</span>
                <div style="flex-grow: 1;"></div>
                <sc-if value="{{t.hidden}}" hint-placeholder-val="{{true}}">
                  <span style="padding: 3px 8px; border-radius: 999px; background: #22242B; color: #FFFFFF; font-size: 10.5px; font-weight: 600;">Đang ẩn</span>
                </sc-if>
              </div>
              <div style="display: flex; gap: 6px;">
                <button type="button" aria-label="Sửa mẫu" style="width: 28px; height: 28px; border-radius: 8px; border: none; background: #FFFFFF; color: #454B57; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"></path></svg>
                </button>
                <button type="button" aria-label="Ẩn hoặc hiện mẫu" style="width: 28px; height: 28px; border-radius: 8px; border: none; background: #FFFFFF; color: #454B57; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
                </button>
                <div style="flex-grow: 1;"></div>
                <span style="display: flex; align-items: center; gap: 4px; padding: 0 9px; height: 28px; border-radius: 8px; background: #FFFFFF; color: #454B57; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600;">{{t.picks}}</span>
              </div>
            </div>
            <figcaption style="display: flex; flex-direction: column; gap: 3px;">
              <span style="font-size: 13px; font-weight: 600;">{{t.name}}</span>
              <span style="font-size: 11.5px; color: #8B92A0;">{{t.group}} · {{t.staff}}</span>
            </figcaption>
          </figure>
        </sc-for>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
        <span style="font-size: 12.5px; color: #737A88;">Hiển thị 17 trên 240 mẫu · số bên phải mỗi ảnh là số lần khách chọn mẫu đó</span>
        <div style="flex-grow: 1;"></div>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid #E4E7EC; background: #FFFFFF; color: #14161A; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 12.5px; font-weight: 600; cursor: pointer;">Tải thêm mẫu</button>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5A43E0","options":["#5A43E0","#14915C","#C2407C","#191B21"],"section":"Thương hiệu"},"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#5A43E0';
    const tints = ['#EFECF5', '#F1EDE8', '#EDEFF2', '#EAEFED', '#EEEDF3', '#F2ECEE'];
    const names = [
      ['HV-231', 'Hoa vẽ tay', 'Nail art', 'Hồng Hạnh', '48'],
      ['HV-118', 'Ombre hồng sữa', 'Sơn gel', 'Ngọc Lan', '126'],
      ['HV-204', 'Kẻ line vàng', 'Nail art', 'Hồng Hạnh', '37'],
      ['HV-076', 'Nude đá nhỏ', 'Sơn gel', 'Quỳnh Như', '91'],
      ['HV-145', 'Móng trong thạch', 'Đắp gel', 'Hồng Hạnh', '54'],
      ['HV-190', 'Đỏ cổ điển', 'Sơn gel', 'Ngọc Lan', '112'],
      ['HV-233', 'Nhũ ánh bạc', 'Sơn gel', 'Thuý An', '29'],
      ['HV-081', 'French trắng mảnh', 'Sơn gel', 'Ngọc Lan', '143'],
      ['HV-212', 'Hoạ tiết kẻ caro', 'Nail art', 'Hồng Hạnh', '22'],
      ['HV-159', 'Almond nâu sữa', 'Đắp gel', 'Quỳnh Như', '76'],
      ['HV-098', 'Chấm bi nhỏ', 'Nail art', 'Thuý An', '18'],
      ['HV-240', 'Mắt mèo xanh rêu', 'Sơn gel', 'Ngọc Lan', '64'],
      ['HV-171', 'Đá charm cụm', 'Nail art', 'Hồng Hạnh', '41'],
      ['HV-055', 'Hồng đất trơn', 'Sơn gel', 'Quỳnh Như', '132'],
      ['HV-186', 'Vuông ngắn trắng sữa', 'Đắp bột', 'Thuý An', '58'],
      ['HV-207', 'Hoa khô ép', 'Nail art', 'Hồng Hạnh', '15'],
      ['HV-044', 'Xanh pastel ombre', 'Sơn gel', 'Ngọc Lan', '87'],
    ];
    return {
      accent,
      nav: [
        { label: 'Tổng quan', href: 'Main.dc.html', d: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z' },
        { label: 'Đơn hàng', href: 'DonHang.dc.html', d: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6' },
        { label: 'Dịch vụ', href: 'DichVu.dc.html', d: 'M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4zM6 17h5M18 15v4' },
        { label: 'Khách hàng', href: 'KhachHang.dc.html', d: 'M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M20 19v-1.5a3.5 3.5 0 0 0-2.6-3.4' },
        { label: 'Nhân viên', href: 'NhanVien.dc.html', d: 'M5 5h14v14H5zM9 10a2 2 0 1 0 4 0 2 2 0 0 0-4 0M8 16c.6-1.4 2-2.1 3-2.1s2.4.7 3 2.1M15 9h2M15 12h2' },
        { label: 'Gallery', href: 'Gallery.dc.html', active: true, d: 'M4 5h16v14H4zM4 15l4-4 3 3 3-3 6 6M15 9h.01' },
        { label: 'Zalo OA', href: 'ZaloOA.dc.html', d: 'M20 15a3 3 0 0 1-3 3H8l-4 3V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z' },
      ].map((n) => ({
        ...n,
        bg: n.active ? '#2A2D36' : 'transparent',
        color: n.active ? '#FFFFFF' : '#9AA1AF',
        weight: n.active ? '600' : '500',
      })),
      filters: [
        { label: 'Tất cả', count: '240', bg: '#191B21', color: '#FFFFFF', border: '#191B21', countColor: '#B9BFC9' },
        { label: 'Sơn gel', count: '96', bg: '#FFFFFF', color: '#5B6270', border: '#E4E7EC', countColor: '#8B92A0' },
        { label: 'Đắp bột / gel', count: '54', bg: '#FFFFFF', color: '#5B6270', border: '#E4E7EC', countColor: '#8B92A0' },
        { label: 'Nail art', count: '68', bg: '#FFFFFF', color: '#5B6270', border: '#E4E7EC', countColor: '#8B92A0' },
        { label: 'Theo mùa', count: '22', bg: '#FFFFFF', color: '#5B6270', border: '#E4E7EC', countColor: '#8B92A0' },
        { label: 'Đang ẩn', count: '54', bg: '#FFFFFF', color: '#5B6270', border: '#E4E7EC', countColor: '#8B92A0' },
      ],
      tiles: names.map((n, i) => ({
        code: n[0], name: n[1], group: n[2], staff: n[3], picks: n[4],
        tint: tints[i % tints.length],
        hidden: i === 8 || i === 15,
      })),
    };
  }
}
</script>
</body>
</html>
